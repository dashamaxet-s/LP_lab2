[project]
name = "concurrency"
version = "0.1.0"
description = "Compare threading, multiprocessing and asyncio on CPU and I/O loads"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
concurrency = "concurrency.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5"]
io = ["httpx>=0.27"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]